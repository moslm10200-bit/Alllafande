<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة الأدمن | شاورما الأفندي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- دخول الأدمن -->
<main class="login" id="loginBox">
  <div class="login-card">
    <a class="back" href="index.html">← العودة للموقع</a>
    <h1>دخول الأدمن</h1>
    <label for="em">البريد الإلكتروني</label>
    <input id="em" type="email" dir="ltr" autocomplete="username">
    <label for="pw">كلمة السر</label>
    <input id="pw" type="password" dir="ltr" autocomplete="current-password">
    <div class="msg" id="loginMsg"></div>
    <button class="btn-main" id="btnIn">دخول</button>
  </div>
</main>

<!-- لوحة الأدمن -->
<div class="panel" id="panel" hidden>
  <header class="head">
    <div><h1>لوحة الأدمن</h1><p id="who"></p></div>
    <div class="head-btns"><a class="btn-soft" href="index.html">المتجر</a><button class="btn-soft" id="btnOut">خروج</button></div>
  </header>

  <nav class="tabs">
    <button class="on" data-tab="tProducts">المنتجات</button>
    <button data-tab="tOrders">الطلبات</button>
    <button data-tab="tSettings">الإعدادات</button>
  </nav>

  <section id="tProducts">
    <div class="bar"><button class="btn-add" id="btnNew">+ منتج جديد</button></div>
    <div id="pList"></div>
    <button class="btn-soft wide" id="btnSeed" hidden>رفع القائمة الافتراضية إلى Firebase</button>
    <div class="msg" id="pMsg"></div>
  </section>

  <section id="tOrders" hidden><div id="oList"></div></section>

  <section id="tSettings" hidden>
    <div class="box">
      <label>رقم واتساب الطلب (بدون +)</label><input id="sWa" dir="ltr" inputmode="numeric">
      <label>نص رقم التواصل</label><input id="sSup" dir="ltr">
      <label>رابط فيديو الواجهة (mp4)</label><input id="sVid" dir="ltr" placeholder="https://...mp4">
      <label>رابط صورة الواجهة</label><input id="sImg" dir="ltr" placeholder="https://...">
      <button class="btn-main" id="btnSet">حفظ الإعدادات</button>
      <div class="msg" id="sMsg"></div>
    </div>
  </section>
</div>

<!-- نافذة إضافة/تعديل منتج -->
<div class="overlay" id="fModal" hidden>
  <div class="sheet">
    <h2 id="formTitle">منتج جديد</h2>
    <label>الاسم</label><input id="pName">
    <label>التصنيف (ساندويش، وجبات، برغر...)</label><input id="pBy">
    <label>السعر</label><input id="pPrice" type="number" step="0.01" inputmode="decimal">
    <label>صورة المنتج</label>
    <div class="up">
      <div class="up-prev" id="upPrev"><span>بدون صورة</span></div>
      <div class="up-btns"><label class="btn-soft" for="pFile">اختر صورة</label><button type="button" class="btn-soft" id="btnNoImg">إزالة</button></div>
      <input id="pFile" type="file" accept="image/*" hidden>
    </div>
    <label>الوصف</label><textarea id="pDesc"></textarea>
    <label>المكوّنات (افصل بفاصلة)</label><input id="pNotes" placeholder="دجاج، ثوم، مخلل">
    <div class="msg" id="fMsg"></div>
    <div class="sheet-btns"><button class="btn-main" id="btnSave">حفظ</button><button class="btn-soft" id="btnCancel">إلغاء</button></div>
  </div>
</div>

<script src="products.js"></script>
<script src="firebase-config.js"></script>
<script src="/api/config"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="admin.js"></script>
</body>
</html>
