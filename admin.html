<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة الإدارة | شاورما الأفندي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="bar"><h1>شاورما الأفندي</h1><div><a href="index.html">الموقع</a><button id="btnOut" hidden>خروج</button></div></div>
<div class="wrap">

  <!-- تسجيل الدخول -->
  <div class="card" id="loginBox">
    <h2>تسجيل دخول الأدمن</h2>
    <label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username">
    <label>كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password">
    <button class="btn" id="btnIn">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- اللوحة -->
  <div id="panel" hidden>
    <div class="tabs">
      <button data-tab="tProducts" class="on">الأصناف</button>
      <button data-tab="tOrders">الطلبات</button>
      <button data-tab="tSettings">الإعدادات</button>
    </div>

    <section id="tProducts">
      <div class="card">
        <h2 id="formTitle">إضافة صنف</h2>
        <label>الاسم</label><input id="pName">
        <label>التصنيف (ساندويش، وجبات، برغر...)</label><input id="pBy">
        <label>السعر</label><input id="pPrice" type="number" step="0.01" inputmode="decimal">
        <label>رابط الصورة (اختياري)</label><input id="pImg" dir="ltr" placeholder="https://...">
        <label>الوصف</label><textarea id="pDesc"></textarea>
        <label>المكوّنات (افصل بفاصلة)</label><input id="pNotes" placeholder="دجاج، ثوم، مخلل">
        <button class="btn" id="btnSave">حفظ</button>
        <button class="btn alt" id="btnReset" hidden>إلغاء التعديل</button>
        <div class="msg" id="pMsg"></div>
      </div>
      <div class="card"><h2>الأصناف</h2><div id="pList"></div>
        <button class="btn alt" id="btnSeed" hidden>رفع القائمة الافتراضية إلى Firebase</button></div>
    </section>

    <section id="tOrders" hidden>
      <div class="card"><h2>آخر الطلبات</h2><div id="oList"></div></div>
    </section>

    <section id="tSettings" hidden>
      <div class="card">
        <h2>إعدادات الموقع</h2>
        <label>رقم واتساب الطلب (بدون +)</label><input id="sWa" dir="ltr" inputmode="numeric">
        <label>نص رقم التواصل</label><input id="sSup" dir="ltr">
        <label>رابط فيديو الواجهة (mp4)</label><input id="sVid" dir="ltr" placeholder="https://...mp4">
        <label>رابط صورة الواجهة</label><input id="sImg" dir="ltr" placeholder="https://...">
        <button class="btn" id="btnSet">حفظ الإعدادات</button>
        <div class="msg" id="sMsg"></div>
      </div>
    </section>
  </div>
</div>

<script src="products.js"></script>
<script src="firebase-config.js"></script>
<script src="/api/config"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="admin.js"></script>
</body>
</html>
